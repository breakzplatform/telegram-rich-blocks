services:
  telegram-rich:
    build: ..
    command: ["serve", "--config", "/config/server.json"]
    network_mode: host
    environment:
      NOTIFIER_BOT_TOKEN: ${NOTIFIER_BOT_TOKEN:?Set the bot token}
    volumes:
      - ./server.json:/config/server.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
