# Merge into ~/.hermes/config.yaml, then: hermes mcp test telegram-rich-blocks
# and hermes gateway restart. Use an absolute path to npx: Hermes passes a
# filtered environment to stdio servers, so PATH may not include it.
mcp_servers:
  telegram-rich-blocks:
    command: /absolute/path/to/npx
    args: [--yes, telegram-rich-blocks, mcp]
    env:
      TELEGRAM_RICH_HOST: hermes
    enabled: true

# Optional, independent of this project: Hermes' own rich rendering of tables,
# task lists, <details> and math in ordinary replies.
platforms:
  telegram:
    extra:
      rich_messages: true
      rich_drafts: false
